name: Zero Warning - Daily Shocking Accidents

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC — adjust freely; see https://crontab.guru
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: "onyx"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEWS_REGION: "US"
          YT_CATEGORY_ID: "22"
          YT_PRIVACY_STATUS: "scheduled"
          YT_PUBLISH_DELAY_HOURS: "3"
        run: python main.py

      - name: Save used-premises state
        run: |
          git config user.name "zero-warning-bot"
          git config user.email "actions@github.com"
          git add state/used_premises.json
          git diff --quiet --cached || git commit -m "Update used premises [skip ci]"
          git pull --rebase origin main
          git push
