name: The Case File - Daily True Crime

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC — adjust freely; see https://crontab.guru
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # needed so the last step can commit state/used_premises.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEWS_REGION: "US"
          YT_CATEGORY_ID: "27"
          YT_PRIVACY_STATUS: "scheduled"
          YT_PUBLISH_DELAY_HOURS: "3"
        run: python main.py

      - name: Save used-premises state
        run: |
          git config user.name "billion-meaning-bot"
          git config user.email "actions@github.com"
          git add state/used_premises.json
          git diff --quiet --cached || git commit -m "Update used premises [skip ci]"
          git push
